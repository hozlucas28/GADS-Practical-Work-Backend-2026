[project]
name = "gads-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() en defaults — patrón aceptado

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["migrations/"]
